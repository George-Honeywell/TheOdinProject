<!-- Tells the Browser to use HTML5 -->
<!DOCTYPE html>

<!-- <html></html> is known as the 'Root Element' -->
<!-- The 'lang' attribute is primarily used for improving accessibility -->
<html lang="en">

    <!-- Contains meta-information about the webpages -->
    <head>
        <!-- The 'meta' tag is important as it ensures that the webpage will display special symbols and characters from different languages correctly -->
        <meta charset="UTF-8">
        <title>My First Webpage</title>
    </head>

    <!-- The <body> tags is where all content that is being displayed to the user should go -->
    <body>
        <h1>Hello, world!</h1>
        <p>In VSCode, there are Shortcuts that can be used to generate boiler plate HTML easily. With a .html file, simply type '!', then press enter. It will generate
            boiler plate HTML very quickly. 'html:5' can also be used to achieve the same result.</p>
    </body>

</html>
